services:
  - type: web
    name: docparser
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7   # pydantic-core==2.23.4 has no prebuilt wheel for newer Pythons
                        # (e.g. 3.14, Render's default) and fails building from source in
                        # Render's sandbox (read-only cargo cache) - see decisions.md #15
      - key: DATABASE_URL
        sync: false   # set to your Neon (or other Postgres) connection string in the
                      # Render dashboard - SQLite's local disk doesn't survive a free-tier
                      # spin-down/restart, so it's not a safe default here. See
                      # decisions.md #19. Falls back to local SQLite only if unset, which
                      # is fine for local dev, not for this deployed instance.
      - key: UPLOAD_DIR
        value: ./uploads
      - key: LLM_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false   # set manually in the Render dashboard — never commit real keys
      - key: EXTRACTION_MODEL
        value: claude-sonnet-4-6
      - key: REVIEW_CONFIDENCE_THRESHOLD
        value: "0.75"
      - key: REPO_SUGGESTION_ENABLED
        value: "false"   # stays off on the public demo instance - see decisions.md #11
